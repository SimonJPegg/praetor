[project]
name = "praetor"
version = "0.1.0"
description = "A Raft consensus implementation using the actor model in Python."
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C901",  # mccabe complexity
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "TRY",   # tryceratops
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
